name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate JavaScript syntax
        run: node --check service/src/main.js
      - name: Validate example configuration
        run: node scripts/validate-config.js config/service.example.json
      - name: Run conformance tests
        run: node --test
